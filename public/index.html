<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rat Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: monospace; }
        #map { height: 100vh; width: 100%; }
        .info-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: #000; padding: 10px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3>🕵️ Active Rats</h3>
        <div id="stats">Loading...</div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        fetch('/api/logs')
            .then(res => res.json())
            .then(logs => {
                document.getElementById('stats').innerText = `Total Tracked: ${logs.length}`;

                logs.forEach(log => {
                    if (log.lat && log.lon) {
                        L.marker([log.lat, log.lon])
                            .bindPopup(`<b>ID:</b> ${log.id}<br><b>IP:</b> ${log.local_ip || 'N/A'}<br><b>Time:</b> ${new Date(log.timestamp).toLocaleString()}`)
                            .addTo(map);
                    }
                });
            });
    </script>
</body>
</html>
